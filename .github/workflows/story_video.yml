name: Story videos (Veo)

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: "Empty = next episode, 3 = next three, 1,2,3 = these episode ids (about $1.20 each)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  veo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate clips
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          VEO_MODEL: ${{ vars.VEO_MODEL }}
        run: python scripts/story_video.py "${{ inputs.episodes }}"
      - name: Save clips
        if: always()
        run: |
          git config user.name "zehnur-bot"
          git config user.email "zehnur-bot@users.noreply.github.com"
          git add -A state.json docs/stories/inbox
          if ! git diff --cached --quiet; then
            git commit -m "stories: new Veo clips"
            git pull --rebase --quiet
            git push --quiet
          fi
